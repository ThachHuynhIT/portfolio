name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # `postinstall` runs `prisma generate`, which reads prisma.config.ts; no real database is touched.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Lint (informational)
        # ~1400 pre-existing errors; remove continue-on-error once they are cleaned up.
        run: npm run lint
        continue-on-error: true
